[project]
name = "corrcut"
version = "0.1.0"
description = "CorrCUT writes CorrMedia playback sidecars (corr.json) for private home viewing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "CorrMedia" }]
dependencies = [
    "PySide6>=6.6.0,<7",
    "qtawesome>=1.3.1",
]

[project.optional-dependencies]
preview = [
    "mpv>=1.0.7",
]
ai = [
    "faster-whisper>=1.0.0",
    # faster-whisper 1.2.x still passes metadata_errors= to av.open(); PyAV 19 removed it.
    "av>=11,<19",
    "numpy>=2.0",
]
ocr = [
    "sup2srt>=0.1.2",
    "pillow>=10.0",
    "numpy>=2.0",
    "paddleocr>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
corrcut = "corrcut.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-packages = true
exclude = [
  "src/corrcut/resources/ffmpeg",
  "src/corrcut/resources/mkvtoolnix",
  "src/corrcut/resources/libmpv",
  "src/corrcut/resources/vobsubocr",
]

[tool.hatch.build.targets.wheel.force-include]
"swears" = "corrcut/resources/swears"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["corrcut"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
